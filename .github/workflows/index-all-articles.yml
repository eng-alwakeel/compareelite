name: Index All Articles (Google)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which URLs to submit'
        required: true
        default: 'resume'
        type: choice
        options:
          - resume     # skip already-indexed, submit next 190 (default)
          - all        # all 208 articles from manifest
          - new        # articles added in last 7 days
          - reset      # clear indexed-urls.json and resubmit everything
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC — drains 190 URLs/day until all indexed

jobs:
  google-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Verify secrets are set
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "❌ GOOGLE_CLIENT_ID secret is not set"; exit 1
          fi
          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "❌ GOOGLE_CLIENT_SECRET secret is not set"; exit 1
          fi
          if [ -z "$GOOGLE_REFRESH_TOKEN" ]; then
            echo "❌ GOOGLE_REFRESH_TOKEN secret is not set"; exit 1
          fi
          echo "✅ All secrets present"
        env:
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      - name: Configure Git for commit-back
        run: |
          git config user.name "CompareElite Bot"
          git config user.email "bot@compareelite.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Submit URLs to Google Indexing API
        id: indexing
        env:
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'resume' }}"
          if [ "$MODE" = "reset" ]; then
            echo "🗑  Reset mode — clearing indexed-urls.json"
            node scripts/google-indexing.js --reset
          elif [ "$MODE" = "new" ]; then
            echo "📤 Submitting NEW articles (last 7 days)..."
            node scripts/google-indexing.js --new
          elif [ "$MODE" = "all" ]; then
            echo "📤 Submitting ALL articles (no resume filter)..."
            node scripts/google-indexing.js --reset && node scripts/google-indexing.js
          else
            echo "📤 Resuming — submitting next batch of unindexed URLs..."
            node scripts/google-indexing.js
          fi

      - name: Commit updated indexed-urls.json
        if: always()
        run: |
          git pull --rebase origin main || true
          git add data/indexed-urls.json data/google-indexing-report.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update indexed-urls.json [$(date -u +%Y-%m-%d)]"
            git push origin main || true
          fi

      - name: Upload indexing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-indexing-report-${{ github.run_id }}
          path: data/google-indexing-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Print report summary
        if: always()
        run: |
          if [ -f data/google-indexing-report.json ]; then
            echo "📊 Indexing Report:"
            python3 -c "
          import json, sys
          r = json.load(open('data/google-indexing-report.json'))
          print(f'  Submitted at:    {r.get(\"submittedAt\",\"unknown\")}')
          print(f'  Total URLs:      {r.get(\"total\",0)}')
          print(f'  Already indexed: {r.get(\"alreadyIndexed\",0)}')
          print(f'  This batch:      {r.get(\"submitted\",0)}')
          print(f'  ✅ Accepted:     {r.get(\"ok\",0)}')
          print(f'  ❌ Errors:       {r.get(\"failed\",0)}')
          print(f'  ⚠️  Quota hit:   {r.get(\"quotaHit\",False)}')
          print(f'  📋 Still pending:{r.get(\"remaining\",0)}')
          failures = r.get('failures', [])
          if failures:
              print('  Failures:')
              for f in failures[:10]:
                  status = f.get('status','?')
                  url = f.get('url','?').split('/')[-1]
                  try:
                      msg = json.loads(f.get('body','{}'))
                      msg = msg.get('error',{}).get('message','')[:60]
                  except:
                      msg = str(f.get('body',''))[:60]
                  print(f'    [{status}] {url} — {msg}')
          "
          else
            echo "⚠️  No report file generated"
          fi

      - name: Fail only on hard errors (not quota)
        if: steps.indexing.outcome == 'failure'
        run: |
          FAILED=$(python3 -c "import json; r=json.load(open('data/google-indexing-report.json')); print(r.get('failed',0))" 2>/dev/null || echo "0")
          if [ "$FAILED" -gt "0" ]; then
            echo "❌ Hard errors encountered: $FAILED URLs failed with non-quota errors"
            exit 1
          fi
          echo "ℹ️  Step exited non-zero but no hard errors — likely quota. OK."
